# ─────────────────────────────────────────────────────────────────────────────
#  Everything the page shows comes from this file. Edit it on GitHub
#  (pencil icon → "Commit changes"); the site updates within a few minutes.
#
#  Rules: keep the indentation (spaces, never tabs); dates are YYYY-MM-DD;
#  times are "HH:MM" in Mexico City time, in quotes.
# ─────────────────────────────────────────────────────────────────────────────

estado:
  # auto        → computed from the "ausencias" list below (recommended)
  # festivo     → holiday, until you switch back to auto
  # sin_clases  → no classes (illness, vacation), until you switch back to auto
  modo: auto
  # Optional note under the status. Leave "" to use the automatic one.
  mensaje: ""

clase:
  # The weekly group class.
  dia: domingo
  inicio: "10:00"
  fin: "10:30"
  enlace: "https://meet.google.com/fxp-mfym-nsd"

contacto:
  correo: slaviana.kustova@gmail.com
  # A Google Form for feedback (Send → link icon → copy the long link,
  # https://docs.google.com/forms/d/e/.../viewform). Leave "" to hide it.
  formulario: ""

ausencias:
  # Holidays and days off. While today falls inside one, the status switches
  # automatically and "next class" skips these days.
  # tipo: festivo · sin_clases
  - desde: 2026-12-21
    hasta: 2027-01-08
    tipo: festivo
    motivo: Vacaciones de invierno / Новогодние каникулы

proyecto:
  descripcion: >-
    Clases de ruso gratuitas para estudiantes de México, impartidas como
    proyecto de voluntariado.
