# ─────────────────────────────────────────────────────────────────────────────
#  Everything the page shows comes from this file. Edit it on GitHub
#  (pencil icon → "Commit changes"); the site updates within a few minutes.
#
#  Rules: keep the indentation (spaces, never tabs); dates are YYYY-MM-DD;
#  times are "HH:MM" in Mexico City time, in quotes.
# ─────────────────────────────────────────────────────────────────────────────

estado:
  # auto        → computed from the "ausencias" list below (recommended)
  # normal      → classes as usual
  # festivo     → holiday
  # sin_clases  → no classes (illness, vacation) until you switch back
  modo: auto
  # Optional note under the status. Leave "" to use the automatic one.
  mensaje: ""

clase:
  # The permanent video-call room. Leave "" while there is none.
  enlace: ""
  plataforma: Google Meet
  # Access code, if the room has one.
  codigo: ""

contacto:
  # Optional. With a number (country code, digits only, e.g. 5215512345678),
  # "Disponible" slots get a WhatsApp button to request them.
  whatsapp: ""

horario:
  # dia: lunes · martes · miércoles · jueves · viernes · sábado · domingo
  # tipo: grupo · individual · disponible
  - dia: lunes
    inicio: "18:00"
    fin: "19:00"
    nivel: A0 — Alfabeto / Алфавит
    tipo: grupo
  - dia: miércoles
    inicio: "18:00"
    fin: "19:00"
    nivel: A1 — Básico / Базовый
    tipo: grupo
  - dia: jueves
    inicio: "17:00"
    fin: "18:00"
    nivel: A1
    tipo: individual
  - dia: viernes
    inicio: "19:00"
    fin: "20:00"
    nivel: Club de conversación / Разговорный клуб
    tipo: grupo
  - dia: sábado
    inicio: "11:00"
    fin: "12:00"
    nivel: Cualquier nivel / Любой уровень
    tipo: disponible

ausencias:
  # Holidays and days off. While today falls inside one, the status switches
  # automatically and the "next class" skips these days.
  # tipo: festivo · sin_clases
  - desde: 2026-12-21
    hasta: 2027-01-08
    tipo: festivo
    motivo: Vacaciones de invierno / Новогодние каникулы

lecciones:
  # Newest lessons are shown first. Every link is optional: leave "" to hide it.
  # presentacion: a Google Slides link (shared "anyone with the link"),
  #               a Canva "view" link, or a PDF.
  - numero: 1
    titulo_es: El alfabeto cirílico
    titulo_ru: Русский алфавит
    fecha: 2026-11-10
    presentacion: ""
    resumen: ""
    audio: ""
    tarjetas: ""
    tarea: ""

proyecto:
  descripcion: >-
    Clases de ruso gratuitas para estudiantes de México, impartidas como
    proyecto de voluntariado.
